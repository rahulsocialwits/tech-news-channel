<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Market Board | TechPulse</title><meta name="description" content="Technology company market board with live quotes, daily changes and price charts."><link rel="canonical" href="https://rahulsocialwits.github.io/tech-news-channel/market.html"><link rel="stylesheet" href="assets/css/style.css?v=20260927-12"></head><body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">T</span><span>Tech<span>Pulse</span></span></a><nav id="mainNav"><a href="index.html">Home</a><a href="latest.html">Latest</a><a href="category.html">Categories</a><a class="active" href="market.html">Market</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="header-tools"><button class="search-btn" id="searchToggle" aria-label="Search TechPulse">⌕</button><button class="menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></div></header>
<main class="market-detail wrap"><div class="market-detail-head"><div><div class="eyebrow">TECH MARKET BOARD</div><h1 id="marketTitle">Technology Companies</h1><p class="meta">Select a company to view price, daily movement and a 30-day chart.</p></div></div><div class="market-selector" id="marketSelector"></div><div id="quoteArea"><div class="loading-card">Loading market data…</div></div></main>
<nav class="mobile-bottom-nav"><a href="index.html"><span>⌂</span><span>Home</span></a><a href="latest.html"><span>▤</span><span>Latest</span></a><a class="active" href="market.html"><span>▥</span><span>Market</span></a><a href="category.html"><span>◈</span><span>Category</span></a><a href="index.html"><span>☰</span><span>Menu</span></a></nav>
<footer><div class="wrap copyright">© 2026 TechPulse · Market data via Finnhub.</div></footer>
<script>
const WORKER='https://tech-news-channel.rahulsocialwits.workers.dev';
const symbols=[['NVDA','NVIDIA'],['AAPL','Apple'],['MSFT','Microsoft'],['GOOGL','Alphabet'],['AMZN','Amazon'],['META','Meta'],['AMD','AMD'],['TSLA','Tesla']];
const params=new URLSearchParams(location.search);let selected=params.get('symbol')||'NVDA';
const selector=document.getElementById('marketSelector');selector.innerHTML=symbols.map(s=>'<a href="market.html?symbol='+s[0]+'" class="'+(s[0]===selected?'active':'')+'">'+s[0]+'</a>').join('');
async function load(){const area=document.getElementById('quoteArea');try{
 const qr=await fetch(WORKER+'/market?t='+Date.now(),{cache:'no-store'});const qd=await qr.json();const q=(qd.quotes||[]).find(x=>x.symbol===selected);if(!q)throw new Error('Quote unavailable');
 document.getElementById('marketTitle').textContent=q.name+' ('+q.symbol+')';
 const up=Number(q.change)>=0;const cls=up?'market-up':'market-down';
 area.innerHTML='<div class="quote-hero"><div class="quote-main"><span class="quote-symbol">'+q.symbol+' · '+q.sector+'</span><div class="quote-price">'+(q.price!=null?'$'+Number(q.price).toFixed(2):'—')+'</div><div class="quote-change '+cls+'">'+(q.change!=null?(up?'+':'')+Number(q.change).toFixed(2)+' · '+(up?'+':'')+Number(q.changePercent).toFixed(2)+'%':'Quote unavailable')+'</div></div><div class="quote-stats"><div class="quote-stat"><span>Open</span><b>'+fmt(q.open)+'</b></div><div class="quote-stat"><span>Previous close</span><b>'+fmt(q.previousClose)+'</b></div><div class="quote-stat"><span>Day high</span><b>'+fmt(q.high)+'</b></div><div class="quote-stat"><span>Day low</span><b>'+fmt(q.low)+'</b></div></div></div><div class="market-chart-box"><h2>30-day price chart</h2><svg id="priceChart" class="market-chart" viewBox="0 0 900 300" preserveAspectRatio="none"></svg><div class="market-chart-note">Daily closing prices. Market data availability depends on provider and market hours.</div></div>';
 try{const hr=await fetch(WORKER+'/market/history?symbol='+encodeURIComponent(selected)+'&days=30');const hd=await hr.json();if(!hd.ok)throw new Error(hd.error||'History unavailable');drawChart(hd.history||[]);}catch(e){document.getElementById('priceChart').outerHTML='<div class="loading-card">Historical chart is temporarily unavailable.</div>';}
 }catch(e){area.innerHTML='<div class="loading-card">Market data is temporarily unavailable.</div>';}}
function fmt(v){return v==null?'—':'$'+Number(v).toFixed(2)}
function drawChart(rows){const svg=document.getElementById('priceChart');if(!svg||!rows.length)return;const vals=rows.map(x=>Number(x.close)).filter(Number.isFinite);const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const pts=rows.map((x,i)=>{const y=270-((Number(x.close)-min)/range)*240;const xx=20+(i/(rows.length-1||1))*860;return xx.toFixed(1)+','+y.toFixed(1)}).join(' ');svg.innerHTML='<polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><text x="20" y="24" font-size="14" fill="currentColor">$'+max.toFixed(2)+'</text><text x="20" y="290" font-size="14" fill="currentColor">$'+min.toFixed(2)+'</text>'; }
load();
</script></body></html>
